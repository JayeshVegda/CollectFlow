name: Build CollectFlow APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/collectflow.jks
          else
            echo "No KEYSTORE_BASE64 secret; generating an ephemeral debug keystore."
            keytool -genkeypair -v \
              -keystore keystore/collectflow.jks \
              -storepass collectflow -keypass collectflow \
              -alias collectflow -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CollectFlow, OU=Dev, O=CollectFlow, L=NA, S=NA, C=IN"
          fi
          ls -lh keystore/

      - name: Run Unit Tests
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/collectflow.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'collectflow' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'collectflow' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'collectflow' }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test_log.txt || {
            echo "## Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Assemble Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/collectflow.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'collectflow' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'collectflow' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'collectflow' }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee assemble_log.txt || {
            echo "## Assemble APKs Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 assemble_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            test_log.txt
            assemble_log.txt

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CollectFlow-debug.apk
          cp app/build/outputs/apk/release/app-release.apk CollectFlow-release.apk
          echo "| Build Type | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug | $(du -h CollectFlow-debug.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | $(du -h CollectFlow-release.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          ls -lh CollectFlow-*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CollectFlow-APKs
          path: CollectFlow-*.apk
          retention-days: 30

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CollectFlow (latest)"
          make_latest: "true"
          body: |
            Latest build from `main`.
            - **CollectFlow-release.apk**: optimized release build.
            - **CollectFlow-debug.apk**: debug build.
          files: |
            CollectFlow-release.apk
            CollectFlow-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}