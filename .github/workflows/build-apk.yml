name: Build CollectFlow APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # A release APK must be signed with the SAME key every time. Android refuses to
      # update-install an APK signed by a different key, so generating a fresh key per run silently
      # forces "uninstall first" — which deletes the ledger. No key, no build.
      - name: Verify signing keystore is present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error title=Signing keystore missing::KEYSTORE_BASE64 is not set. Refusing to build: an ephemeral key would make every published APK unable to update-install over the previous one."
            {
              echo "## Release blocked - no signing keystore"
              echo ""
              echo "This workflow used to generate a new keystore whenever KEYSTORE_BASE64 was absent."
              echo "Android will not update-install an APK signed by a different key, so every published"
              echo "release required uninstalling the app first - which deletes the ledger."
              echo ""
              echo "### To fix"
              echo "1. Create the keystore once, and keep it safe (losing it means the same problem again):"
              echo "   keytool -genkeypair -keystore collectflow.jks -alias collectflow -keyalg RSA -keysize 2048 -validity 10000"
              echo "2. Add repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
              echo "   base64 -w0 collectflow.jks    # paste the output into KEYSTORE_BASE64"
              echo "3. Re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/collectflow.jks
          ls -lh keystore/collectflow.jks

      - name: Run Unit Tests
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/collectflow.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'collectflow' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'collectflow' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'collectflow' }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test_log.txt || {
            echo "## Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=== TEST LOG FAILURE OUTPUT ==="
            cat test_log.txt
            exit 1
          }

      - name: Assemble Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/collectflow.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'collectflow' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'collectflow' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'collectflow' }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee assemble_log.txt || {
            echo "## Assemble APKs Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 assemble_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            test_log.txt
            assemble_log.txt

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CollectFlow-debug.apk
          cp app/build/outputs/apk/release/app-release.apk CollectFlow-release.apk
          echo "| Build Type | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug | $(du -h CollectFlow-debug.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | $(du -h CollectFlow-release.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          ls -lh CollectFlow-*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CollectFlow-APKs
          path: CollectFlow-*.apk
          retention-days: 30

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CollectFlow (latest)"
          make_latest: "true"
          body: |
            Latest build from `main`.
            - **CollectFlow-release.apk**: optimized release build.
            - **CollectFlow-debug.apk**: debug build.
          files: |
            CollectFlow-release.apk
            CollectFlow-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}